# Free Supabase projects pause after a week with no activity.
# This asks for one listing every 3 days so the project never goes idle.
# It reads the public URL and publishable key from js/config.js, so there's nothing to set up.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'   # 03:17 UTC every 3rd day
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping the listings database
        run: |
          URL=$(sed -n "s/.*supabaseUrl: *'\([^']*\)'.*/\1/p" js/config.js)
          KEY=$(sed -n "s/.*supabaseAnonKey: *'\([^']*\)'.*/\1/p" js/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase isn't connected yet (js/config.js is empty), nothing to ping."
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "${URL%/}/rest/v1/listings?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase answered with HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase didn't answer normally. If it says the project is paused, restore it in the Supabase dashboard."
            exit 1
          fi
