<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Listings Admin · Fraser Marine Sales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="bar">
    <span class="brand">Fraser <em>Marine</em> <small>Listings</small></span>
    <div class="bar-actions">
      <a class="link" href="./" target="_blank" rel="noopener">View site</a>
      <button class="link" id="signOut" type="button" hidden>Sign out</button>
    </div>
  </header>

  <main class="wrap">
    <!-- Not configured yet -->
    <section class="panel" id="setupView" hidden>
      <h1>Almost there</h1>
      <p>This page needs your Supabase details. Add your project URL and anon key to <code>js/config.js</code>, then reload.</p>
    </section>

    <!-- Sign in -->
    <section class="panel narrow" id="loginView" hidden>
      <h1>Sign in</h1>
      <form id="loginForm" class="form">
        <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Sign in</button>
        <button class="link" type="button" id="forgot">Forgot password?</button>
        <p class="msg" id="loginMsg" role="status"></p>
      </form>
    </section>

    <!-- Set a new password (after following a reset email) -->
    <section class="panel narrow" id="resetView" hidden>
      <h1>Choose a new password</h1>
      <form id="resetForm" class="form">
        <label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn" type="submit">Save password</button>
        <p class="msg" id="resetMsg" role="status"></p>
      </form>
    </section>

    <!-- Listings -->
    <section id="listView" hidden>
      <div class="list-head">
        <h1>Your boats</h1>
        <button class="btn" id="addBoat" type="button">+ Add a boat</button>
      </div>
      <p class="msg" id="listMsg" role="status"></p>
      <div class="list" id="list"></div>
    </section>

    <!-- Add / edit -->
    <section class="panel" id="editView" hidden>
      <button class="link back" id="backToList" type="button">← All boats</button>
      <h1 id="editTitle">Add a boat</h1>
      <form id="editForm" class="form grid">
        <label class="full">Title<input name="title" required placeholder="e.g. 1990 Fraser 737 Hardtop"></label>
        <label>Status
          <select name="status">
            <option value="draft">Draft (hidden)</option>
            <option value="for_sale">For sale</option>
            <option value="under_offer">Under offer</option>
            <option value="sold">Sold</option>
          </select>
        </label>
        <label>Price (AUD)<input name="price" type="number" inputmode="numeric" min="0" step="1" placeholder="Leave blank for POA"></label>
        <label>Price wording<input name="price_label" placeholder="Optional, e.g. Offers over"></label>
        <label>Year<input name="year" type="number" inputmode="numeric" min="1900" max="2100"></label>
        <label>Make<input name="make" placeholder="e.g. Fraser"></label>
        <label>Model<input name="model" placeholder="e.g. 737"></label>
        <label>Length (m)<input name="length_m" type="number" inputmode="decimal" step="0.01" min="0"></label>
        <label>Engine<input name="engine" placeholder="e.g. MerCruiser 350 MAG"></label>
        <label>Engine hours<input name="engine_hours" type="number" inputmode="numeric" min="0"></label>
        <label>Location<input name="location" placeholder="e.g. Perth, WA"></label>
        <label>Order on site<input name="sort" type="number" inputmode="numeric" value="0"><small>Lower numbers show first</small></label>
        <label class="full">Description<textarea name="description" rows="7" placeholder="Condition, features, recent work, what's included…"></textarea></label>

        <div class="full photos">
          <div class="photos-head">
            <span>Photos <small>The first photo is the cover</small></span>
            <label class="btn ghost small">+ Add photos<input id="photoInput" type="file" accept="image/*" multiple hidden></label>
          </div>
          <div class="photo-grid" id="photoGrid"></div>
        </div>

        <div class="full actions">
          <button class="btn" type="submit" id="saveBtn">Save boat</button>
          <button class="btn danger ghost" type="button" id="deleteBtn" hidden>Delete boat</button>
        </div>
        <p class="msg full" id="editMsg" role="status"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
